<html>

<head>
    <title>Typography</title>
</head>

<style>
    blockquote {
        font-size: 25px;
        font-style: italic;
        color: rgb(101, 55, 144);
        border-left: 5px solid lightgreen;
        padding-left: 5px;
        display: inline-block;
        text-align: left;

    }

    mark {
        color: rgb(18, 12, 18);
        background-color: rgb(15, 244, 168);
    }
</style>

<body>
    <p class="display-1">Heading 1</p>
    <p class="display-2">Heading 2</p>
    <p class="display-3">Heading 3</p>
    <p class="display-4">Heading 4</p>

    <blockquote>
        <p>Knowledge is power.</p>
        <p>Dr. Allama Muhammad Iqbal</p>
    </blockquote>

    <p>Global warming is due to raise in <mark>Global temperature.</mark></p>

    <h2>Welcome to Oxford!<small>university</small></h2>

    <p>Hover Content
        <abbr title="United Nations">UN</abbr>
    </p>
</body>

</html>
